<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم إدارة المفكرة الروحية</title>
    <style>
        :root {
            --church-purple: #4a154b;
            --gold: #d4af37;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --success: #2ecc71;
            --primary-blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
        }

        .church-logo { font-size: 40px; margin-bottom: 5px; }
        header h1 { margin: 0; font-size: 26px; color: var(--church-purple); }
        .subtitle { margin: 5px 0 0; color: #718096; font-size: 15px; }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
        }

        .stat-card h4 { margin: 0 0 10px; font-size: 14px; color: #718096; }
        .stat-card .number { font-size: 24px; font-weight: bold; color: var(--church-purple); }

        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-section input, .filter-section select {
            padding: 10px 15px;
            border: 2px solid #cbd5e0;
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            flex: 1;
            min-width: 180px;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            background: white;
        }

        table { width: 100%; border-collapse: collapse; text-align: center; }
        th, td { padding: 14px 10px; border-bottom: 1px solid #edf2f7; font-size: 14px; }
        th { background: var(--church-purple); color: white; font-weight: 600; white-space: nowrap; }

        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            display: inline-block;
        }
        .badge-high { background: #e6fffa; color: #234e52; }
        .badge-medium { background: #feebc8; color: #744210; }
        .badge-low { background: #fff5f5; color: #9b2c2c; }

        .btn-refresh-db {
            background: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            margin-bottom: 20px;
        }
        .btn-refresh-db:hover { opacity: 0.9; }

        .no-data {
            padding: 20px;
            color: #a0aec0;
            font-weight: 500;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <header>
            <div class="church-logo">
