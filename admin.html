<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم إدارة المفكرة الروحية</title>
  <style>
    :root {
      --primary: #4a154b;
      --primary-light: #611f69;
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --success: #2e7d32;
      --warning: #ed6c02;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .header h1 {
      color: var(--primary);
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    .header p {
      color: #666;
      margin: 0;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-refresh {
      background-color: #1976d2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-refresh:hover {
      background-color: #1565c0;
    }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .stat-card h3 {
      margin: 0;
      font-size: 14px;
      color: #666;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
      margin-top: 5px;
    }

    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .search-input, .select-input {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
    }

    .search-input {
      flex: 1;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-high {
      background-color: #e8f5e9;
      color: var(--success);
    }

    .badge-medium {
      background-color: #fff3e0;
      color: var(--warning);
    }

    .btn-details {
      background-color: #4a154b;
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .btn-details:hover {
      background-color: #611f69;
    }

    .status-msg {
      text-align: center;
      padding: 20px;
      color: #666;
    }

    /* Modal / النافذة المنبثقة */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: white;
      width: 90%;
      max-width: 650px;
      max-height: 85vh;
      border-radius: 12px;
      padding: 20px;
      overflow-y: auto;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      position: relative;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      margin: 0;
      color: var(--primary);
      font-size: 18px;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: #888;
      font-weight: bold;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px #eee dashed;
      gap: 10px;
    }

    .detail-item .label {
      font-weight: bold;
      color: #444;
      flex: 1;
    }

    .detail-item .val {
      color: #000;
      font-weight: 600;
      text-align: left;
      flex: 1;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⛪ لوحة تحكم إدارة المفكرة الروحية</h1>
      <p>متابعة نتائج تقارير المفكرة الروحية الأسبوعية</p>
    </div>

    <div class="controls-bar">
      <button class="btn-refresh" onclick="fetchData()">🔄 تحديث البيانات الآن</button>
    </div>

    <div class="stats-cards">
      <div class="stat-card">
        <h3>إجمالي المشاركين</h3>
        <div class="value" id="totalParticipants">0</div>
      </div>
      <div class="stat-card">
        <h3>متوسط نسبة الإنجاز</h3>
        <div class="value" id="avgPercentage">0%</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث باسم الخادم / المخدوم..." oninput="filterData()">
      <select id="weekFilter" class="select-input" onchange="filterData()">
        <option value="all">جميع الأسابيع</option>
        <option value="الأسبوع الأول">الأسبوع الأول</option>
        <option value="الأسبوع الثاني">الأسبوع الثاني</option>
        <option value="الأسبوع الثالث">الأسبوع الثالث</option>
        <option value="الأسبوع الرابع">الأسبوع الرابع</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الأسبوع</th>
            <th>نسبة الإنجاز</th>
            <th>حالة التقييم</th>
            <th>التفاصيل</th>
          </tr>
        </thead>
        <tbody id="dataTableBody">
          <tr>
            <td colspan="5" class="status-msg">جاري تحميل البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- النافذة المنبثقة لرؤية الإجابات -->
  <div class="modal-overlay" id="detailsModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalTitle">📖 تفاصيل النوتة الروحية</h2>
        <button class="close-btn" onclick="closeModal()">✖</button>
      </div>
      <div id="modalBody">
        <!-- ستظهر الإجابات والأسئلة هنا -->
      </div>
    </div>
  </div>

  <script>
    // الرابط الجديد المحدث بالكامل:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbz-JN510tDUSVS2By41FclGD0hNGEBFegrPrlLfyuFk2YX_wnEwtNSgd6KTCFG5y_75xw/exec';

    let allData = [];
    let headers = [];

    function fetchData() {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '<tr><td colspan="5" class="status-msg">⏳ جاري جلب البيانات من السيرفر...</td></tr>';

      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${SCRIPT_URL}?callback=handleScriptResponse&t=${new Date().getTime()}`;
      script.onerror = function() {
        tbody.innerHTML = '<tr><td colspan="5" class="status-msg" style="color:red;">❌ تعذر جلب البيانات. التأكد من نشر Google Script بحساب Anyone.</td></tr>';
      };
      document.body.appendChild(script);
    }

    function handleScriptResponse(res) {
      if (res && res.data) {
        allData = res.data;
        headers = res.headers || ["الاسم", "الأسبوع", "النسبة", "التاريخ"];
      } else if (Array.isArray(res)) {
        allData = res;
        headers = ["الاسم", "الأسبوع", "النسبة", "التاريخ"];
      } else {
        allData = [];
      }

      if (allData.length > 0) {
        renderData(allData);
        updateStats(allData);
      } else {
        document.getElementById('dataTableBody').innerHTML = '<tr><td colspan="5" class="status-msg">لا توجد بيانات متاحة حالياً.</td></tr>';
      }
    }

    function renderData(data) {
      const tbody = document.getElementById('dataTableBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="status-msg">لا توجد سجلات مطابقة.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map((item, index) => {
        const perc = parseFloat(item.percentage) || 0;
        const badgeClass = perc >= 70 ? 'badge-high' : 'badge-medium';
        const badgeText = perc >= 70 ? 'ممتاز' : 'مقبول';

        return `
          <tr>
            <td>${item.name || '-'}</td>
            <td>${item.week || '-'}</td>
            <td><strong>${perc}%</strong></td>
            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
            <td><button class="btn-details" onclick="showDetails(${index})">👁️ عرض الإجابات</button></td>
          </tr>
        `;
      }).join('');
    }

    function showDetails(index) {
      const item = allData[index];
      if (!item) return;

      document.getElementById('modalTitle').innerText = `📖 تقرير: ${item.name || 'بدون اسم'} (${item.week || ''})`;
      const modalBody = document.getElementById('modalBody');

      // تفقد الإجابات التفصيلية
      const rowValues = item.fullRow || [item.name, item.week, item.percentage + '%', item.date];

      let htmlContent = '';
      for (let i = 0; i < rowValues.length; i++) {
        const questionLabel = headers[i] || `السؤال ${i + 1}`;
        const answerValue = rowValues[i] !== undefined && rowValues[i] !== "" ? rowValues[i] : '-';

        htmlContent += `
          <div class="detail-item">
            <span class="label">${questionLabel}:</span>
            <span class="val">${answerValue}</span>
          </div>
        `;
      }

      modalBody.innerHTML = htmlContent;
      document.getElementById('detailsModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('detailsModal').style.display = 'none';
    }

    function updateStats(data) {
      document.getElementById('totalParticipants').innerText = data.length;
      if (data.length === 0) {
        document.getElementById('avgPercentage').innerText = '0%';
        return;
      }
      const sum = data.reduce((acc, curr) => acc + (parseFloat(curr.percentage) || 0), 0);
      const avg = Math.round(sum / data.length);
      document.getElementById('avgPercentage').innerText = `${avg}%`;
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const week = document.getElementById('weekFilter').value;

      const filtered = allData.filter(item => {
        const matchName = !search || (item.name && item.name.toLowerCase().includes(search));
        const matchWeek = week === 'all' || item.week === week;
        return matchName && matchWeek;
      });

      renderData(filtered);
    }

    // إغلاق النافذة عند الضغط خارج المودال
    window.onclick = function(event) {
      const modal = document.getElementById('detailsModal');
      if (event.target === modal) {
        closeModal();
      }
    };

    window.onload = fetchData;
  </script>
</body>
</html>
