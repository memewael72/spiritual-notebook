<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم الأدمن - متابعة المفكرة الروحية</title>
    <style>
        :root {
            --church-purple: #4a154b;
            --gold: #d4af37;
            --bg-gradient: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --card-bg: #ffffff;
            --text-main: #2d3748;
            --success: #2ecc71;
            --primary-blue: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }

        .admin-container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        header {
            text-align: center;
            border-bottom: 2px solid #edf2f7;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            color: var(--church-purple);
            margin: 0 0 5px 0;
            font-size: 26px;
        }

        .controls-section {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 25px;
            background: #f7fafc;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            align-items: center;
            justify-content: space-between;
        }

        .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex: 1;
            min-width: 250px;
        }

        .filter-group label {
            font-weight: bold;
            color: var(--church-purple);
            white-space: nowrap;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        .btn-refresh {
            background-color: var(--primary-blue);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: opacity 0.2s;
        }

        .btn-refresh:hover {
            opacity: 0.9;
        }

        .table-container {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: center;
        }

        th, td {
            padding: 12px 10px;
            border-bottom: 1px solid #edf2f7;
            font-size: 14px;
        }

        th {
            background-color: var(--church-purple);
            color: white;
            font-weight: 600;
            white-space: nowrap;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge-percent {
            background-color: #e6fffa;
            color: #234e52;
            padding: 4px 8px;
            border-radius: 6px;
            font-weight: bold;
            border: 1px solid #b2f5ea;
        }

        .details-btn {
            background: var(--church-purple);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }

        .close-btn {
            float: left;
            font-size: 20px;
            font-weight: bold;
            cursor: pointer;
            color: #a0aec0;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <header>
            <h1>📊 لوحة تحكم الخدام والأدمن</h1>
            <p>متابعة إجابات المفكرة الروحية للكنيسة</p>
        </header>

        <div class="controls-section">
            <div class="filter-group">
                <label for="searchInput">بحث بالاسم:</label>
                <input type="text" id="searchInput" placeholder="اكتب اسم الخادم/المخدوم...">
            </div>
            <div class="filter-group">
                <label for="weekFilter">تصفية بالأسبوع:</label>
                <select id="weekFilter">
                    <option value="ALL">جميع الأسابيع</option>
                    <option value="الأسبوع الأول">الأسبوع الأول</option>
                    <option value="الأسبوع الثاني">الأسبوع الثاني</option>
                    <option value="الأسبوع الثالث">الأسبوع الثالث</option>
                    <option value="الأسبوع الرابع">الأسبوع الرابع</option>
                </select>
            </div>
            <button class="btn-refresh" onclick="fetchData()">🔄 تحديث البيانات</button>
        </div>

        <div class="table-container">
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>الاسم</th>
                        <th>الأسبوع</th>
                        <th>نسبة الإنجاز</th>
                        <th>تاريخ الإرسال</th>
                        <th>تفاصيل الإجابات</th>
                    </tr>
                </thead>
                <tbody id="dataTableBody">
                    <tr>
                        <td colspan="6" style="text-align:center;">جاري تحميل البيانات...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Details Modal -->
    <div id="detailsModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h3 id="modalTitle" style="color: var(--church-purple); margin-top:0;">تفاصيل الإجابات</h3>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNPQbZRbM4gq1AVN7FiE7trCfMW94Kppk-81bFGT7P9-nVAuYRHWh--r6S-PpZRqDdxA/exec";
        let allData = [];

        const days = ["السبت", "الأحد", "الإثنين", "الثلاثاء", "الأربعاء", "الخميس", "الجمعة"];
        const activities = ["باكر", "النوم", "كتاب مقدس", "التناول", "الاجتماع"];

        async function fetchData() {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">جاري جلب البيانات من Google Sheets...</td></tr>';
            
            try {
                const response = await fetch(SCRIPT_URL);
                const data = await response.json();
                allData = data;
                renderTable(allData);
            } catch (error) {
                console.error("Error fetching data:", error);
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color:red;">حدث خطأ أثناء جلب البيانات. تأكدي من إعدادات النشر.</td></tr>';
            }
        }

        function renderTable(data) {
            const tbody = document.getElementById('dataTableBody');
            tbody.innerHTML = '';

            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;">لا توجد بيانات مسجلة حالياً.</td></tr>';
                return;
            }

            data.forEach((item, index) => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${index + 1}</td>
                    <td style="font-weight:bold;">${item.name}</td>
                    <td>${item.week}</td>
                    <td><span class="badge-percent">${item.percentage}</span></td>
                    <td style="font-size:12px; color:#718096;">${item.date}</td>
                    <td><button class="details-btn" onclick="showDetails(${index})">عرض الجدول</button></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterData() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const weekVal = document.getElementById('weekFilter').value;

            const filtered = allData.filter(item => {
                const matchesName = item.name.toLowerCase().includes(searchVal);
                const matchesWeek = (weekVal === "ALL") || (item.week === weekVal);
                return matchesName && matchesWeek;
            });

            renderTable(filtered);
        }

        document.getElementById('searchInput').addEventListener('input', filterData);
        document.getElementById('weekFilter').addEventListener('change', filterData);

        function showDetails(index) {
            const item = allData[index];
            document.getElementById('modalTitle').innerText = `جدول متابعة: ${item.name} (${item.week})`;
            
            const rawResponses = item.fullRow.slice(4); // Responses start at index 4
            let html = '<table style="width:100%; border-collapse:collapse; margin-top:15px;">';
            html += '<tr style="background:#f7fafc;"><th>اليوم</th>';
            activities.forEach(act => html += `<th>${act}</th>`);
            html += '</tr>';

            let resIndex = 0;
            days.forEach(day => {
                html += `<tr><td style="font-weight:bold;">${day}</td>`;
                activities.forEach(() => {
                    const val = rawResponses[resIndex] === "TRUE" || rawResponses[resIndex] === true ? "✅" : "❌";
                    html += `<td>${val}</td>`;
                    resIndex++;
                });
                html += '</tr>';
            });
            html += '</table>';

            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('detailsModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('detailsModal').style.display = 'none';
        }

        // Fetch data on load
        fetchData();
    </script>
</body>
</html>
