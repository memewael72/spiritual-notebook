<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم إدارة المفكرة الروحية</title>
  <style>
    :root {
      --primary: #4a154b;
      --primary-light: #611f69;
      --bg-color: #f4f4f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-color: #e0e0e0;
      --success: #2e7d32;
      --warning: #ed6c02;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      direction: rtl;
    }

    .container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      background: var(--card-bg);
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    .header h1 {
      color: var(--primary);
      margin: 0 0 10px 0;
      font-size: 24px;
    }

    .header p {
      color: #666;
      margin: 0;
    }

    .controls-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn-refresh {
      background-color: #1976d2;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: background 0.2s;
    }

    .btn-refresh:hover {
      background-color: #1565c0;
    }

    .stats-cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-bottom: 20px;
    }

    .stat-card {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .stat-card h3 {
      margin: 0;
      font-size: 14px;
      color: #666;
    }

    .stat-card .value {
      font-size: 24px;
      font-weight: bold;
      color: var(--primary);
      margin-top: 5px;
    }

    .filters {
      display: flex;
      gap: 15px;
      margin-bottom: 15px;
    }

    .search-input, .select-input {
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 14px;
    }

    .search-input {
      flex: 1;
    }

    .table-container {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: right;
    }

    th, td {
      padding: 12px 15px;
      border-bottom: 1px solid var(--border-color);
    }

    th {
      background-color: var(--primary);
      color: white;
      font-weight: 600;
    }

    tr:hover {
      background-color: #f8f9fa;
    }

    .badge {
      padding: 4px 8px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: bold;
      display: inline-block;
    }

    .badge-high {
      background-color: #e8f5e9;
      color: var(--success);
    }

    .badge-medium {
      background-color: #fff3e0;
      color: var(--warning);
    }

    .status-msg {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h1>⛪ لوحة تحكم إدارة المفكرة الروحية</h1>
      <p>متابعة نتائج تقارير المفكرة الروحية الأسبوعية</p>
    </div>

    <div class="controls-bar">
      <button class="btn-refresh" onclick="fetchData()">🔄 تحديث البيانات الآن</button>
    </div>

    <div class="stats-cards">
      <div class="stat-card">
        <h3>إجمالي المشاركين</h3>
        <div class="value" id="totalParticipants">0</div>
      </div>
      <div class="stat-card">
        <h3>متوسط نسبة الإنجاز</h3>
        <div class="value" id="avgPercentage">0%</div>
      </div>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 بحث باسم الخادم / المخدوم..." oninput="filterData()">
      <select id="weekFilter" class="select-input" onchange="filterData()">
        <option value="all">جميع الأسابيع</option>
        <option value="الأسبوع الأول">الأسبوع الأول</option>
        <option value="الأسبوع الثاني">الأسبوع الثاني</option>
        <option value="الأسبوع الثالث">الأسبوع الثالث</option>
        <option value="الأسبوع الرابع">الأسبوع الرابع</option>
      </select>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>الاسم</th>
            <th>الأسبوع</th>
            <th>نسبة الإنجاز</th>
            <th>حالة التقييم</th>
          </tr>
        </thead>
        <tbody id="dataTableBody">
          <tr>
            <td colspan="4" class="status-msg">جاري تحميل البيانات...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    // الرابط الجديد الخاص بكِ مدمج هنا جاهزاً:
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwGUe3RBWvSYvygccZuE0D33aSyOA5oe8uSEfzsYdFACM0fbcfhvn81VxKoWypOOXdG0w/exec';

    let allData = [];

    // جلب البيانات عبر JSONP
    function fetchData() {
      const tbody = document.getElementById('dataTableBody');
      tbody.innerHTML = '<tr><td colspan="4" class="status-msg">⏳ جاري جلب البيانات من السيرفر...</td></tr>';

      const oldScript = document.getElementById('jsonp-script');
      if (oldScript) oldScript.remove();

      const script = document.createElement('script');
      script.id = 'jsonp-script';
      script.src = `${SCRIPT_URL}?callback=handleScriptResponse&t=${new Date().getTime()}`;
      script.onerror = function() {
        tbody.innerHTML = '<tr><td colspan="4" class="status-msg" style="color:red;">❌ تعذر جلب البيانات. تأكدي من إعدادات النشر في Google Script وأن الصلاحية مضبوطة على "Anyone".</td></tr>';
      };
      document.body.appendChild(script);
    }

    function handleScriptResponse(data) {
      if (Array.isArray(data)) {
        allData = data;
        renderData(allData);
        updateStats(allData);
      } else {
        document.getElementById('dataTableBody').innerHTML = '<tr><td colspan="4" class="status-msg">لا توجد بيانات متاحة حالياً.</td></tr>';
      }
    }

    function renderData(data) {
      const tbody = document.getElementById('dataTableBody');
      if (!data || data.length === 0) {
        tbody.innerHTML = '<tr><td colspan="4" class="status-msg">لا توجد سجلات مطابقة.</td></tr>';
        return;
      }

      tbody.innerHTML = data.map(item => {
        const perc = parseFloat(item.percentage) || 0;
        const badgeClass = perc >= 70 ? 'badge-high' : 'badge-medium';
        const badgeText = perc >= 70 ? 'ممتاز' : 'مقبول';

        return `
          <tr>
            <td>${item.name || '-'}</td>
            <td>${item.week || '-'}</td>
            <td><strong>${perc}%</strong></td>
            <td><span class="badge ${badgeClass}">${badgeText}</span></td>
          </tr>
        `;
      }).join('');
    }

    function updateStats(data) {
      document.getElementById('totalParticipants').innerText = data.length;
      if (data.length === 0) {
        document.getElementById('avgPercentage').innerText = '0%';
        return;
      }
      const sum = data.reduce((acc, curr) => acc + (parseFloat(curr.percentage) || 0), 0);
      const avg = Math.round(sum / data.length);
      document.getElementById('avgPercentage').innerText = `${avg}%`;
    }

    function filterData() {
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const week = document.getElementById('weekFilter').value;

      const filtered = allData.filter(item => {
        const matchName = !search || (item.name && item.name.toLowerCase().includes(search));
        const matchWeek = week === 'all' || item.week === week;
        return matchName && matchWeek;
      });

      renderData(filtered);
    }

    window.onload = fetchData;
  </script>
</body>
</html>
